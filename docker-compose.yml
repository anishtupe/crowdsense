version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: crowdsense
      POSTGRES_PASSWORD: crowdsense
      POSTGRES_DB: crowdsense
    ports:
      - "5432:5432"
    volumes:
      - crowdsense_db:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.backend
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  crowdsense_db:
